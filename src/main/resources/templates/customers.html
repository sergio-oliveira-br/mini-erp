<!DOCTYPE html >
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="description" content="The objective of this cloud-based app is to establish a comprehensive CI/CD pipeline for the entire lifecycle.">
    <meta name="keywords" content="Thymeleaf, Java, Spring Boot, NCI-2025, DevOpsSec, Mini-ERP, Customers">
    <meta name="author" content="Sergio Oliveira">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!--    Boostrap    -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <title>Customer | Mini-ERP</title>

</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand">Home</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page">Customers</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link">Products</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link">Sales</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" aria-disabled="true">Admin</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

    </header>

    <main class="container mt-3">

        <form>
            <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Phone Number</label>
                <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="## ### ####">
            </div>

            <div class="input-group mb-3">
                <span class="input-group-text" id="customer-name">Customer Name</span>
                <input type="text" class="form-control" placeholder="First Name"  aria-label="customer-name" aria-describedby="basic-addon1">
                <input type="text" class="form-control" placeholder="Second Name" aria-label="customer-name" aria-describedby="basic-addon1">
            </div>
            <div class="mt-auto d-flex justify-content-end">
                <button class="col col-2 btn btn-dark">Save</button>
            </div>

        </form>

        <table class="mt-5 table">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>First Name</th>
                    <th>Second Name</th>
                    <th>Phone Number</th>
                    <th></th>
                </tr>
            </thead>

            <tbody>

            </tbody>
        </table>
    </main>

    <footer>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </footer>

    <!--    Boostrap    -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
</body>
</html>
