<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="description" content="The objective of this cloud-based app is to establish a comprehensive CI/CD pipeline for the entire lifecycle.">
    <meta name="keywords" content="Thymeleaf, Java, Spring Boot, NCI-2025, DevOpsSec, Mini-ERP, Sales">
    <meta name="author" content="Sergio Oliveira">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!--    Boostrap    -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <title>Sales | Mini-ERP</title>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand">Home</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link"  th:href="@{/customers}">Customers</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/products}">Products</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" th:href="@{sales}">Sales</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" aria-disabled="true">Admin</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mt-3">

        <form>

            <div class="row">
                <div class="col col-12 mb-3">
                    <label for="customer-first-name" class="form-label">Customer Datails</label>
                    <input th:type="text" class="form-control" id="customer-first-name" placeholder="">
                </div>
            </div>

            <div class="row">
                <div class="col col-3">
                    <label for="product-description" class="form-label">Product Item</label>
                    <input th:type="text" class="form-control" id="product-description" placeholder="Description">
                </div>

                <div class="col col-3">
                    <label for="sales-qty" class="form-label">Sales Qty</label>
                    <input th:type="number" class="form-control" id="sales-qty">
                </div>

                <div class="col col-3">
                    <label for="sales-price" class="form-label">Sales Price</label>
                    <input th:type="number" class="form-control" id="sales-price">
                </div>

                <div class="col col-3">
                    <label for="product-balance" class="form-label">Product Balance</label>
                    <input th:type="number" class="form-control" id="product-balance">
                </div>
            </div>

            <div class="mt-3 d-flex justify-content-end">
                <button class="col col-2 btn btn-primary">Create</button>
            </div>
        </form>

        <table class="mt-5 table">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Customer</th>
                    <th>Product</th>
                    <th>Unit Price</th>
                    <th>Qty</th>
                    <th>Total Price</th>
                    <th></th>
                </tr>
            </thead>

            <tbody>

            </tbody>
        </table>



    </main>

    <footer>
        <div th:replace="~{fragments/footer :: footer}"></div>
    </footer>

</body>
</html>
