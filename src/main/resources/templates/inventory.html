<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="description" content="The objective of this cloud-based app is to establish a comprehensive CI/CD pipeline for the entire lifecycle.">
    <meta name="keywords" content="Thymeleaf, Java, Spring Boot, NCI-2025, DevOpsSec, Mini-ERP, Products">
    <meta name="author" content="Sergio Oliveira">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!--    Boostrap    -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <title>Inventory Management | DevOpsSec CA 2025</title>
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a th:href="@{/index}" class="navbar-brand">Home</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" th:href="@{/inventory}">Inventory</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mt-3">

        <form>
            <div class="row g-3">
                <div class="col-12 col-md-12 mb-3">
                    <label for="product-description" class="form-label">Product</label>
                    <input th:type="text" class="form-control" id="product-description" placeholder="Description">
                </div>
            </div>

            <div class="row">
                <div class="col-12 col-md-6 mb-3">
                    <label for="product-cost-price" class="form-label">Price</label>
                    <input type="number" class="form-control" id="product-cost-price" placeholder="#.##">
                </div>

                <div class="col-12 col-md-6 mb-3">
                    <label for="product-qty-available" class="form-label">Quantity Available</label>
                    <input type="number" class="form-control" id="product-qty-available" placeholder="#">
                </div>
            </div>

            <div class="col-12 d-flex justify-content-end">
                <button class="btn btn-dark">Create</button>
            </div>
        </form>



        <table class="mt-5 table">
            <thead>
            <tr>
                <th>Id</th>
                <th>Description</th>
                <th>Price</th>
                <th>Quantity Available</th>
                <th>Logged</th>
                <th>Created by</th>
                <th></th>
            </tr>
            </thead>

            <tbody>

            </tbody>
        </table>
    </main>

    <footer>
        <div th:replace="~{fragments/footer :: footer}"></div>

    </footer>

    <!--    Boostrap    -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous">
    </script>

</body>
</html>
